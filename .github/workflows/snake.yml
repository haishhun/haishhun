name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: haishhun
          outputs: |
            dist/github-snake.svg?color_snake=#3FB950&color_dots=#161B22,#2D174A,#542A85,#8B5CF6,#A78BFA
            dist/github-snake-dark.svg?color_snake=#3FB950&color_dots=#161B22,#2D174A,#542A85,#8B5CF6,#A78BFA
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}