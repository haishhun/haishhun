name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: haishhun
          outputs: |
            dist/github-snake.svg?color_snake=#3FB950&color_dots=#10001a,#3b0764,#6b21a8,#a855f7,#e879f9
            dist/github-snake-dark.svg?color_snake=#3FB950&color_dots=#10001a,#3b0764,#6b21a8,#a855f7,#e879f9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}